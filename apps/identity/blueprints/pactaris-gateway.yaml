# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
# Deployment configuration for authentik 2026.8.5. No client credentials belong here.
version: 1
metadata:
  name: Pactaris-OIDC
  labels:
    blueprints.goauthentik.io/instantiate: "false"
context:
  application_name: Pactaris
  application_slug: pactaris
  provider_name: Pactaris-OIDC
  profile_mapping_name: pactaris-profile
  instance_origin: https://pactaris.app/
  redirect_uri: https://pactaris.app/auth/oidc/callback
  signing_key_name: authentik Self-signed Certificate
entries:
  # Minimal profile: do not disclose central group memberships through the profile scope.
  - model: authentik_providers_oauth2.scopemapping
    id: pactaris-profile
    state: present
    identifiers:
      name: !Context profile_mapping_name
    attrs:
      scope_name: profile
      expression: |
        return {
            "name": request.user.name,
            "preferred_username": request.user.username,
            # Lets the gateway manage this person's own sign-in devices (docs/ACCOUNT_SECURITY.md).
            "pactaris_identity_user": request.user.pk,
        }

  # email_verified is true only while the current address is the one confirmed through the
  # pactaris-account-verify-email flow (pactaris-account.yaml, docs/VERIFIED_EMAIL.md).
  - model: authentik_providers_oauth2.scopemapping
    id: pactaris-email
    state: present
    identifiers:
      name: pactaris-email
    attrs:
      scope_name: email
      expression: |
        email = request.user.email
        verified_address = request.user.attributes.get("email_verified_address")
        return {
            "email": email,
            "email_verified": bool(email and verified_address == email),
        }

  - model: authentik_providers_oauth2.oauth2provider
    id: pactaris-provider
    state: present
    identifiers:
      name: !Context provider_name
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      grant_types:
        - authorization_code
      # Omitted intentionally: authentik generates client_id/client_secret on creation
      # and preserves them when this blueprint updates the existing provider.
      redirect_uris:
        - matching_mode: strict
          redirect_uri_type: authorization
          url: !Context redirect_uri
      issuer_mode: per_provider
      sub_mode: hashed_user_id
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, !Context signing_key_name]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !KeyOf pactaris-profile
        - !KeyOf pactaris-email
      access_code_validity: minutes=1
      access_token_validity: minutes=5

  - model: authentik_core.application
    id: pactaris-application
    state: present
    identifiers:
      slug: !Context application_slug
    attrs:
      name: !Context application_name
      provider: !KeyOf pactaris-provider
      group: Pactaris
      policy_engine_mode: all
      meta_launch_url: !Context instance_origin
      meta_publisher: CoyWorks
