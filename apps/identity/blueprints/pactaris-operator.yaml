# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
# Operator sign-in for Pactaris (docs/OPERATOR_ACCESS.md), authentik 2026.8.5.
# The gateway sends /auth/operator through this flow before the normal authorization request, so
# operators always enter their password and a second factor. The default sign-in flow is unchanged:
# people keep their "remember this device" window there.
#
# Why a separate flow: the operator console needs `amr` to contain "mfa" from a sign-in in the last
# five minutes. In the default flow the second-factor stage is skipped while its last-validation
# threshold applies, and `prompt=login` runs that same flow, so the token then has no "mfa".
#
# After importing, set `"operatorFlow": "pactaris-operator"` in the gateway's `oidc` configuration.
version: 1
metadata:
  name: Pactaris-Operator-Sign-In
  labels:
    blueprints.goauthentik.io/instantiate: "false"
entries:
  - model: authentik_stages_password.passwordstage
    id: password
    state: present
    identifiers:
      name: pactaris-operator-password
    attrs:
      backends:
        - authentik.core.auth.InbuiltBackend
      failed_attempts_before_cancel: 5
      allow_show_password: true
  - model: authentik_stages_identification.identificationstage
    id: identification
    state: present
    identifiers:
      name: pactaris-operator-identification
    attrs:
      user_fields: [username, email]
      case_insensitive_matching: true
      pretend_user_exists: true
      show_matched_user: true
      password_stage: !KeyOf password
  # Always asks: no threshold, so a remembered second factor is never reused here. Accounts
  # without a second factor are refused.
  - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
    id: second-factor
    state: present
    identifiers:
      name: pactaris-operator-second-factor
    attrs:
      device_classes: [totp, webauthn, static]
      not_configured_action: deny
      last_auth_threshold: seconds=0
      webauthn_user_verification: required
  - model: authentik_stages_user_login.userloginstage
    id: login
    state: present
    identifiers:
      name: pactaris-operator-login
    attrs:
      session_duration: seconds=0

  - model: authentik_flows.flow
    id: flow
    state: present
    identifiers:
      slug: pactaris-operator
    attrs:
      name: Pactaris - operator sign-in
      title: Operator sign-in
      designation: authentication
      authentication: none
  - model: authentik_flows.flowstagebinding
    identifiers: {target: !KeyOf flow, stage: !KeyOf identification}
    attrs: {order: 10}
  - model: authentik_flows.flowstagebinding
    identifiers: {target: !KeyOf flow, stage: !KeyOf second-factor}
    attrs: {order: 20}
  - model: authentik_flows.flowstagebinding
    identifiers: {target: !KeyOf flow, stage: !KeyOf login}
    attrs: {order: 30}
