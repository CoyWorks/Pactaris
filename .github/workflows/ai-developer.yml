name: Pactaris AI Developer

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "GitHub issue number"
        required: true
        type: number

permissions:
  contents: read
  issues: read

concurrency:
  group: pactaris-ai-developer
  cancel-in-progress: false

jobs:
  develop:
    name: Implement issue
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Fetch issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json number,title,body > .pactaris-ai-issue.json
      - name: Implement with Codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ':workspace'
          prompt: |
            Implement the GitHub issue in .pactaris-ai-issue.json.
            Read AGENTS.md and README.md and discover/review relevant docs.
            Follow docs/DEVELOPMENT.md. Inspect existing code before editing.
            Make a coherent, tested change. Preserve safety, privacy, authorization,
            tenant isolation, configuration and existing user data.
            Never edit AGENTS.md, .github/, .codex/ or deploy files.
            Do not commit, push, deploy or access production systems.
            Use existing project conventions and translation keys.
            Do not read unrelated docs unnecessarily.
      - name: Prepare candidate patch
        run: |
          rm -f .pactaris-ai-issue.json
          git add -N .
          git diff --binary > "$RUNNER_TEMP/candidate.patch"
          test -s "$RUNNER_TEMP/candidate.patch"
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-0
          path: ${{ runner.temp }}/candidate.patch
          retention-days: 3
  verify_0:
    name: Verify candidate 1/3
    needs: [develop]
    if: ${{ always() && needs.develop.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      passed: ${{ steps.check.outputs.passed }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture-only-admin-password
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: candidate-0
          path: ${{ runner.temp }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply and verify candidate
        id: check
        env:
          TEST_DATABASE_URL: postgresql://postgres:fixture-only-admin-password@127.0.0.1:5432/postgres
        shell: bash
        run: |
          set -uo pipefail
          LOG="$RUNNER_TEMP/verification.log"
          PATCH="$RUNNER_TEMP/candidate.patch"
          echo 'passed=false' >> "$GITHUB_OUTPUT"
          cat > "$RUNNER_TEMP/check.sh" <<'CHECK'
          git apply --check "$RUNNER_TEMP/candidate.patch"
            git apply "$RUNNER_TEMP/candidate.patch"
            git add -A
            git diff --cached --quiet && { echo 'Empty patch'; exit 1; }
            if git diff --cached --name-only | grep -E '^(\.github/|\.codex/|AGENTS\.md$)'; then
              echo 'Protected file modified'
              exit 1
            fi
            git diff --cached --check
            npm ci --ignore-scripts --no-audit --no-fund
            npm run check
            npm run build
            npm run test:integration
            node --stack_size=512 node_modules/typescript/bin/tsc --noEmit -p tsconfig.json
            bash -n install.sh update.sh status.sh resume.sh
          CHECK
          if bash -euo pipefail "$RUNNER_TEMP/check.sh" > "$LOG" 2>&1; then
            RC=0
          else
            RC=$?
          fi
          if [ "$RC" -eq 0 ]; then
            echo 'passed=true' >> "$GITHUB_OUTPUT"
            echo 'All verification checks passed.'
          else
            echo "Verification failed (exit $RC)."
            tail -n 100 "$LOG"
          fi
          # Intentional success: the decision is carried via the passed output.
          exit 0
      - name: Upload verification result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-0
          path: ${{ runner.temp }}/verification.log
          retention-days: 3
  repair_1:
    name: Codex repair 1/2
    needs: [verify_0]
    if: ${{ always() && needs.verify_0.result == 'success' && needs.verify_0.outputs.passed == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: candidate-0
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@v4
        with:
          name: verification-0
          path: ${{ runner.temp }}
      - name: Restore failed candidate
        run: |
          git apply --check "$RUNNER_TEMP/candidate.patch"
          git apply "$RUNNER_TEMP/candidate.patch"
          cp "$RUNNER_TEMP/verification.log" .pactaris-verification.log
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Repair with Codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ':workspace'
          prompt: |
            You are repairing an implementation of Pactaris issue #${{ inputs.issue_number }}.
            The current checkout contains the PREVIOUS Codex implementation.
            Read .pactaris-verification.log for the exact failing checks.
            Read AGENTS.md and relevant project documentation.
            Fix the root cause, including whitespace errors if present.
            Preserve the existing intended implementation and its tests.
            Do not suppress assertions or weaken security/privacy checks.
            Do not modify AGENTS.md, .github/, .codex/ or deployment files.
            Do not commit, push, deploy or access production systems.
      - name: Save repaired candidate
        run: |
          rm -f .pactaris-verification.log
          git add -N .
          git diff --binary > "$RUNNER_TEMP/candidate.patch"
          test -s "$RUNNER_TEMP/candidate.patch"
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-1
          path: ${{ runner.temp }}/candidate.patch
          retention-days: 3
  verify_1:
    name: Verify candidate 2/3
    needs: [repair_1]
    if: ${{ always() && needs.repair_1.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      passed: ${{ steps.check.outputs.passed }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture-only-admin-password
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: candidate-1
          path: ${{ runner.temp }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply and verify candidate
        id: check
        env:
          TEST_DATABASE_URL: postgresql://postgres:fixture-only-admin-password@127.0.0.1:5432/postgres
        shell: bash
        run: |
          set -uo pipefail
          LOG="$RUNNER_TEMP/verification.log"
          PATCH="$RUNNER_TEMP/candidate.patch"
          echo 'passed=false' >> "$GITHUB_OUTPUT"
          cat > "$RUNNER_TEMP/check.sh" <<'CHECK'
          git apply --check "$RUNNER_TEMP/candidate.patch"
            git apply "$RUNNER_TEMP/candidate.patch"
            git add -A
            git diff --cached --quiet && { echo 'Empty patch'; exit 1; }
            if git diff --cached --name-only | grep -E '^(\.github/|\.codex/|AGENTS\.md$)'; then
              echo 'Protected file modified'
              exit 1
            fi
            git diff --cached --check
            npm ci --ignore-scripts --no-audit --no-fund
            npm run check
            npm run build
            npm run test:integration
            node --stack_size=512 node_modules/typescript/bin/tsc --noEmit -p tsconfig.json
            bash -n install.sh update.sh status.sh resume.sh
          CHECK
          if bash -euo pipefail "$RUNNER_TEMP/check.sh" > "$LOG" 2>&1; then
            RC=0
          else
            RC=$?
          fi
          if [ "$RC" -eq 0 ]; then
            echo 'passed=true' >> "$GITHUB_OUTPUT"
            echo 'All verification checks passed.'
          else
            echo "Verification failed (exit $RC)."
            tail -n 100 "$LOG"
          fi
          # Intentional success: the decision is carried via the passed output.
          exit 0
      - name: Upload verification result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-1
          path: ${{ runner.temp }}/verification.log
          retention-days: 3
  repair_2:
    name: Codex repair 2/2
    needs: [verify_1]
    if: ${{ always() && needs.verify_1.result == 'success' && needs.verify_1.outputs.passed == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: candidate-1
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@v4
        with:
          name: verification-1
          path: ${{ runner.temp }}
      - name: Restore failed candidate
        run: |
          git apply --check "$RUNNER_TEMP/candidate.patch"
          git apply "$RUNNER_TEMP/candidate.patch"
          cp "$RUNNER_TEMP/verification.log" .pactaris-verification.log
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Repair with Codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ':workspace'
          prompt: |
            You are repairing an implementation of Pactaris issue #${{ inputs.issue_number }}.
            The current checkout contains the PREVIOUS Codex implementation.
            Read .pactaris-verification.log for the exact failing checks.
            Read AGENTS.md and relevant project documentation.
            Fix the root cause, including whitespace errors if present.
            Preserve the existing intended implementation and its tests.
            Do not suppress assertions or weaken security/privacy checks.
            Do not modify AGENTS.md, .github/, .codex/ or deployment files.
            Do not commit, push, deploy or access production systems.
      - name: Save repaired candidate
        run: |
          rm -f .pactaris-verification.log
          git add -N .
          git diff --binary > "$RUNNER_TEMP/candidate.patch"
          test -s "$RUNNER_TEMP/candidate.patch"
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-2
          path: ${{ runner.temp }}/candidate.patch
          retention-days: 3
  verify_2:
    name: Verify candidate 3/3
    needs: [repair_2]
    if: ${{ always() && needs.repair_2.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      passed: ${{ steps.check.outputs.passed }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture-only-admin-password
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: candidate-2
          path: ${{ runner.temp }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply and verify candidate
        id: check
        env:
          TEST_DATABASE_URL: postgresql://postgres:fixture-only-admin-password@127.0.0.1:5432/postgres
        shell: bash
        run: |
          set -uo pipefail
          LOG="$RUNNER_TEMP/verification.log"
          PATCH="$RUNNER_TEMP/candidate.patch"
          echo 'passed=false' >> "$GITHUB_OUTPUT"
          cat > "$RUNNER_TEMP/check.sh" <<'CHECK'
          git apply --check "$RUNNER_TEMP/candidate.patch"
            git apply "$RUNNER_TEMP/candidate.patch"
            git add -A
            git diff --cached --quiet && { echo 'Empty patch'; exit 1; }
            if git diff --cached --name-only | grep -E '^(\.github/|\.codex/|AGENTS\.md$)'; then
              echo 'Protected file modified'
              exit 1
            fi
            git diff --cached --check
            npm ci --ignore-scripts --no-audit --no-fund
            npm run check
            npm run build
            npm run test:integration
            node --stack_size=512 node_modules/typescript/bin/tsc --noEmit -p tsconfig.json
            bash -n install.sh update.sh status.sh resume.sh
          CHECK
          if bash -euo pipefail "$RUNNER_TEMP/check.sh" > "$LOG" 2>&1; then
            RC=0
          else
            RC=$?
          fi
          if [ "$RC" -eq 0 ]; then
            echo 'passed=true' >> "$GITHUB_OUTPUT"
            echo 'All verification checks passed.'
          else
            echo "Verification failed (exit $RC)."
            tail -n 100 "$LOG"
          fi
          # Intentional success: the decision is carried via the passed output.
          exit 0
      - name: Upload verification result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-2
          path: ${{ runner.temp }}/verification.log
          retention-days: 3
  publish:
    name: Publish passing draft PR
    needs: [verify_0, verify_1, verify_2]
    if: ${{ always() && (needs.verify_0.outputs.passed == 'true' || needs.verify_1.outputs.passed == 'true' || needs.verify_2.outputs.passed == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select passing artifact
        id: select
        env:
          PASS0: ${{ needs.verify_0.outputs.passed }}
          PASS1: ${{ needs.verify_1.outputs.passed }}
          PASS2: ${{ needs.verify_2.outputs.passed }}
        run: |
          if [ "$PASS0" = true ]; then echo 'artifact=candidate-0' >> "$GITHUB_OUTPUT"
          elif [ "$PASS1" = true ]; then echo 'artifact=candidate-1' >> "$GITHUB_OUTPUT"
          elif [ "$PASS2" = true ]; then echo 'artifact=candidate-2' >> "$GITHUB_OUTPUT"
          else exit 1; fi
      - uses: actions/download-artifact@v4
        with:
          name: ${{ steps.select.outputs.artifact }}
          path: ${{ runner.temp }}
      - name: Validate and commit
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          set -euo pipefail
          BRANCH="ai/issue-${ISSUE_NUMBER}-${GITHUB_RUN_ID}"
          echo "AI_BRANCH=$BRANCH" >> "$GITHUB_ENV"
          git switch -c "$BRANCH"
          git apply --check "$RUNNER_TEMP/candidate.patch"
          git apply "$RUNNER_TEMP/candidate.patch"
          git add -A
          git diff --cached --check
          if git diff --cached --name-only | grep -E '^(\.github/|\.codex/|AGENTS\.md$)'; then
            echo 'Protected file modified'; exit 1
          fi
          git diff --cached --quiet && exit 1
          git config user.name 'Pactaris AI Developer'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "AI: Implement issue #${ISSUE_NUMBER}"
      - name: Push and create draft PR
        env:
          GH_TOKEN: ${{ secrets.PACTARIS_BOT_TOKEN }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git push origin "HEAD:refs/heads/$AI_BRANCH"
          printf 'AI-generated implementation for issue #%s.\n\nRefs #%s\n\nVerification passed. Review required before merging. No production deployment.\n' "$ISSUE_NUMBER" "$ISSUE_NUMBER" > "$RUNNER_TEMP/pr-body.md"
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$AI_BRANCH" --draft \
            --title "AI: Implement issue #${ISSUE_NUMBER}" --body-file "$RUNNER_TEMP/pr-body.md"

  result:
    name: Final result
    needs: [develop, verify_0, repair_1, verify_1, repair_2, verify_2, publish]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Confirm outcome
        env:
          PUBLISH: ${{ needs.publish.result }}
        run: |
          if [ "$PUBLISH" != success ]; then
            echo 'No draft PR produced. Inspect verification artifacts and repair steps.'
            exit 1
          fi
          echo 'Passing draft PR published.'
