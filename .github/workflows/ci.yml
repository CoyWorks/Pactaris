name: Foundation checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture-only-admin-password
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      # Regression for compiler stack overflow seen on the OCI host.
      # Keep all test files checked, including the real PostgreSQL fixture.
      - run: node --stack_size=512 node_modules/typescript/bin/tsc --noEmit -p tsconfig.json
      - run: npm run build
      - run: test ! -d dist/server/tests
      - run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgresql://postgres:fixture-only-admin-password@127.0.0.1:5432/postgres
      - run: npm run schema:check
        env:
          TEST_DATABASE_URL: postgresql://postgres:fixture-only-admin-password@127.0.0.1:5432/postgres
      - run: bash -n install.sh update.sh status.sh resume.sh
