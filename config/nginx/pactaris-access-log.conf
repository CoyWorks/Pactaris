# Include once in the NGINX http context. Enable only on Pactaris vhosts.
map $uri $pactaris_request_class {
    default page;
    ~^/health/ health;
    ~^/api/ api;
    ~^/auth/ identity;
    ~^/application/o/ identity;
    ~^/(assets|pwa)/ asset;
}

log_format pactaris_access escape=json
    '{"at":"$time_iso8601","class":"$pactaris_request_class",'
    '"method":"$request_method","status":"$status","bytes":"$body_bytes_sent",'
    '"seconds":"$request_time","upstreamStatus":"$upstream_status"}';
